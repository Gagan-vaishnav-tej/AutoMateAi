<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Campaign Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
  <h1 class="mb-4">📅 AI Campaign Dashboard</h1>

  <form id="campaignForm" class="card p-3 mb-4">
    <h4 class="mb-3">Start New Campaign</h4>
    <div class="mb-3">
      <label class="form-label">Topic</label>
      <input type="text" class="form-control" name="topic" placeholder="e.g. Future of AI" required>
    </div>
    <div class="row">
  <div class="col-md-4 mb-3">
    <label class="form-label">Days</label>
    <input type="number" class="form-control" name="days" value="5" min="1" max="30" required>
  </div>
  <div class="col-md-4 mb-3">
    <label class="form-label">Hour (24h)</label>
    <input type="number" class="form-control" name="hour" value="10" min="0" max="23" required>
  </div>
  <div class="col-md-4 mb-3">
    <label class="form-label">Minute</label>
    <input type="number" class="form-control" name="minute" value="0" min="0" max="59" required>
  </div>
</div>

    <button class="btn btn-primary w-100" type="submit">🚀 Start Campaign</button>
  </form>

  <div id="result" class="alert d-none"></div>

  <h4>Active Scheduled Jobs</h4>
  <table class="table table-bordered" id="jobsTable">
    <thead>
      <tr><th>ID</th><th>Topic</th><th>Run Time</th><th>Action</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
async function loadJobs() {
  const res = await fetch("/jobs");
  const jobs = await res.json();
  const tbody = document.querySelector("#jobsTable tbody");
  tbody.innerHTML = "";
  jobs.forEach(job => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${job.id}</td>
      <td>${job.args?.[0] || "—"}</td>
      <td>${new Date(job.next_run_time).toLocaleString()}</td>
      <td><button class="btn btn-danger btn-sm" onclick="cancelJob('${job.id}')">🗑️ Cancel</button></td>
    `;
    tbody.appendChild(tr);
  });
}

async function cancelJob(id) {
  const res = await fetch("/jobs/cancel/" + id, { method: "DELETE" });
  const data = await res.json();
  alert(data.message);
  loadJobs();
}

document.getElementById("campaignForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const body = {
    topic: form.topic.value,
    days: form.days.value,
    hour: form.hour.value,
    minute: form.minute.value
  };
  const res = await fetch("/ai/campaign/start", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  const alertDiv = document.getElementById("result");
  alertDiv.classList.remove("d-none", "alert-danger", "alert-success");
  alertDiv.classList.add(data.ok ? "alert-success" : "alert-danger");
  alertDiv.textContent = data.message || data.error;
  if (data.ok) loadJobs();
});

loadJobs();
</script>
</body>
</html>
