<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Campaign Dashboard — AI Post Assistant</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        /* CONSOLIDATED AND CORRECT CSS */
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --accent: #0073b1; /* LinkedIn blue */
            --text-color: #222;
            --border-color: #e0e6ed;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        body {
            background: var(--bg-color);
            font-family: "Inter", "Segoe UI", sans-serif;
            color: var(--text-color);
            margin: 0;
            padding: 30px;
        }

        .container-style {
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            padding-top: 20px;
            padding-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 24px;
            transition: all 0.2s ease-in-out;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        h3, h4 {
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 16px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-col {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 15px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0, 115, 177, 0.15);
        }

        button.primary {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            align-self: stretch; /* Make it full width in the form */
            transition: all 0.25s ease;
        }

        button.primary:hover {
            background: #005c8f;
            transform: translateY(-1px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid #eaeaea;
            text-align: left;
            font-size: 15px;
        }

        th {
            background: #f3f6fa;
            color: #333;
            font-weight: 600;
        }

        tr:hover {
            background: #f9fbfd;
        }

        td button.danger {
            background: #ff5c5c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.25s ease;
        }

        td button.danger:hover {
            background: #e23e3e;
        }
        
        /* Custom styles for the result/alert box */
        .alert-message {
            padding: 15px;
            margin-bottom: 24px;
            border-radius: 8px;
            font-weight: 600;
            border: 1px solid transparent;
            display: none; /* controlled by JS */
        }
        
        .alert-message.alert-success {
            color: #0f5132;
            background-color: #d1e7dd;
            border-color: #badbcc;
            display: block;
        }
        
        .alert-message.alert-danger {
            color: #842029;
            background-color: #f8d7da;
            border-color: #f5c2c7;
            display: block;
        }
    </style>
</head>
<body>
<div class="container-style">
    <h1>📅 AI Campaign Dashboard</h1>

    <form id="campaignForm" class="card">
        <h4>Start New Campaign</h4>
        <div class="form-group">
            <label>Topic</label>
            <input type="text" name="topic" placeholder="e.g. Future of AI" required>
        </div>
        <div class="form-row">
            <div class="form-col">
                <label>Days</label>
                <input type="number" name="days" value="5" min="0" max="30" required>
            </div>
            <div class="form-col">
                <label>Hour (24h)</label>
                <input type="number" name="hour" value="10" min="0" max="23" required>
            </div>
            <div class="form-col">
                <label>Minute</label>
                <input type="number" name="minute" value="0" min="0" max="59" required>
            </div>
        </div>

        <button class="primary" type="submit">🚀 Start Campaign</button>
    </form>

    <div id="result" class="alert-message"></div>

    <h3>Active Scheduled Jobs</h3>
    <table id="jobsTable">
        <thead>
            <tr><th>ID</th><th>Topic</th><th>Run Time</th><th>Action</th></tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
async function loadJobs() {
    const res = await fetch("/jobs");
    const jobs = await res.json();
    const tbody = document.querySelector("#jobsTable tbody");
    tbody.innerHTML = "";
    
    if (jobs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #777;">No active scheduled jobs.</td></tr>';
        return;
    }
    
    jobs.forEach(job => {
        const tr = document.createElement("tr");
        const rawTopic = job.topic || job.args?.[0] || 'N/A';
        const topic = rawTopic.substring(0, 50) + (rawTopic.length > 50 ? '...' : '');
        tr.innerHTML = `
            <td>${job.id.substring(0, 8)}...</td>
            <td>${topic}</td>
            <td>${new Date(job.next_run_time).toLocaleString()}</td>
            <td><button class="danger" onclick="cancelJob('${job.id}')">❌ Cancel</button></td>
        `;
        tbody.appendChild(tr);
    });
}

async function cancelJob(id) {
    if (!confirm(`Are you sure you want to cancel job ${id.substring(0, 8)}...?`)) return;
    
    try {
        const res = await fetch("/jobs/cancel/" + id, { method: "DELETE" });
        const data = await res.json();
        
        if (res.ok) {
            alert(`✅ Job ${id.substring(0, 8)}... cancelled successfully!`);
        } else {
            alert(`❌ Failed to cancel job: ${data.error || data.message || 'Unknown error'}`);
        }
    } catch (error) {
        alert("❌ Network Error: Could not cancel the job.");
    }
    loadJobs();
}

document.getElementById("campaignForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    
    const submitButton = form.querySelector('button[type="submit"]');
    submitButton.disabled = true;
    submitButton.textContent = "Scheduling...";
    
    const body = {
        topic: form.topic.value,
        days: parseInt(form.days.value),
        hour: parseInt(form.hour.value),
        minute: parseInt(form.minute.value)
    };
    
    const alertDiv = document.getElementById("result");
    alertDiv.className = "alert-message"; // Reset class

    try {
        const res = await fetch("/ai/campaign/start", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        
        const data = await res.json();
        
        if (res.ok) {
            alertDiv.classList.add("alert-success");
            alertDiv.textContent = `📅 Campaign scheduled for ${body.days} days! Message: ${data.message || 'Success'}`;
            loadJobs();
        } else {
            alertDiv.classList.add("alert-danger");
            alertDiv.textContent = "❌ Failed to schedule campaign: " + (data.error || data.message || 'Unknown Error');
        }
    } catch (error) {
        alertDiv.classList.add("alert-danger");
        alertDiv.textContent = "❌ Network Error: Could not connect to the server.";
    } finally {
        submitButton.disabled = false;
        submitButton.textContent = "🚀 Start Campaign";
    }
});

loadJobs();
</script>
</body>
</html>
