<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Post Assistant</title>
  <style>
    body {
      font-family: "Inter", sans-serif;
      background: #f9fafb;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      margin: 6px 0;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .user { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #e5e7eb; color: #111827; border-bottom-left-radius: 4px; }

    .input-area {
      display: flex;
      padding: 12px;
      background: white;
      border-top: 1px solid #e5e7eb;
      align-items: center;
    }
    .input-area textarea {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      resize: none;
      font-size: 14px;
    }
    .input-area button {
      margin-left: 8px;
      padding: 0 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: 500;
      cursor: pointer;
    }
    select {
      margin-right: 10px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: white;
      font-size: 14px;
    }
    .controls {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .controls button {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .listen-btn { background: #10b981; color: white; }
    .stop-btn { background: #ef4444; color: white; }
    .feedback-btn { background: #6366f1; color: white; }
    .post-btn { background: #2563eb; color: white; }
    .newchat-btn { background: #9ca3af; color: white; }
  </style>
</head>
<body>
  <div class="chat-container" id="chatContainer">
    <div class="message bot">👋 Hi! What would you like to post about today?</div>
  </div>

  <div class="input-area">
    <select id="platformSelect">
      <option value="linkedin" selected>LinkedIn</option>
      <option value="twitter">Twitter</option>
    </select>

    <textarea id="userInput" rows="2" placeholder="Type your idea or use voice 🎙️"></textarea>
    <button id="voiceBtn">🎙️</button>
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const chatContainer = document.getElementById("chatContainer");
    const sendBtn = document.getElementById("sendBtn");
    const voiceBtn = document.getElementById("voiceBtn");
    const userInput = document.getElementById("userInput");
    const synth = window.speechSynthesis;

    function appendMessage(text, sender = "bot") {
      const msg = document.createElement("div");
      msg.className = `message ${sender}`;
      msg.textContent = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msg;
    }

    function renderControls(previewText, platform) {
      const controls = document.createElement("div");
      controls.className = "controls";
      controls.innerHTML = `
        <button class="listen-btn">🔊 Listen</button>
        <button class="stop-btn">🛑 Stop</button>
        <button class="feedback-btn">🗣️ Give Feedback</button>
        <button class="post-btn">🚀 Post</button>
        <button class="newchat-btn">🆕 New Chat</button>
      `;
      chatContainer.appendChild(controls);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      // 🎧 Listen
      controls.querySelector(".listen-btn").onclick = () => {
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(previewText);
        utterance.lang = "en-US";
        utterance.rate = 1.0;
        synth.speak(utterance);
      };

      // 🛑 Stop
      controls.querySelector(".stop-btn").onclick = () => synth.cancel();

      // 🗣️ Feedback (regenerate)
      controls.querySelector(".feedback-btn").onclick = async () => {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = "en-US";
        appendMessage("🎤 Listening for your feedback...", "bot");

        recognition.onresult = async (event) => {
          const feedback = event.results[0][0].transcript;
          appendMessage("You said: " + feedback, "user");

          const response = await fetch("/ai/api/voice_intent", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ input: feedback, platform })
          });

          const feedbackData = await response.json();
          appendMessage(feedbackData.message || "🔄 Updated content:", "bot");
          appendMessage(feedbackData.preview, "bot");
          renderControls(feedbackData.preview, platform); // ✅ Re-render controls every time
        };
        recognition.start();
      };

    // 🚀 Post
    controls.querySelector(".post-btn").onclick = async () => {
      if (!previewText) {
        appendMessage("⚠️ No content available to post.", "bot");
        return;
      }

      console.log("Preview before post:", previewText);
      console.log("Preview before post:", platform);

      const resp = await fetch("/ai/api/post_confirmed", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          platform,
          text: previewText
        })
      });

      const postData = await resp.json();
      if (resp.ok) {
        appendMessage(postData.message || "✅ Post shared successfully!", "bot");
      } else {
        appendMessage(`⚠️ Post failed: ${postData.error || postData.message}`, "bot");
      }
    };



      // 🆕 New Chat
      controls.querySelector(".newchat-btn").onclick = async () => {
        const resp = await fetch("/ai/post", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ action: "New Chat" })
        });
        const resetData = await resp.json();
        appendMessage(resetData.message || "🆕 New chat started.", "bot");
      };
    }

    async function sendMessage(input) {
      appendMessage(input, "user");
      userInput.value = "";

      const thinking = appendMessage("🤔 Generating your preview...", "bot");
      const platform = document.getElementById("platformSelect").value;

      const response = await fetch("/ai/api/voice_intent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ input, platform })
      });

      const data = await response.json();
      thinking.remove();

      if (data.preview) {
        appendMessage(data.message || "✨ Here's your preview:", "bot");
        appendMessage(data.preview, "bot");
        renderControls(data.preview, platform); // ✅ Controls appear every time
      } else {
        appendMessage("⚠️ " + (data.error || "Something went wrong."), "bot");
      }
    }

    sendBtn.onclick = () => {
      const text = userInput.value.trim();
      if (text) sendMessage(text);
    };

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });

    voiceBtn.onclick = () => {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = "en-US";
      appendMessage("🎧 Listening...", "bot");
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        sendMessage(transcript);
      };
      recognition.start();
    };
  </script>
</body>
</html>
