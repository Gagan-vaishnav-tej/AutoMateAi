<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Post Generator Interface</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* General Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #202123;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .dropdown-menu {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .dropdown-menu span {
            font-size: 1.1em;
            font-weight: 600;
        }

        .dropdown-menu i {
            margin-left: 8px;
            font-size: 0.8em;
        }

        .upgrade-button {
            background-color: #6a49a8;
            color: #ffffff;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9em;
            transition: background-color 0.2s;
        }

        .upgrade-button:hover {
            background-color: #553b87;
        }

        .settings-icon {
            font-size: 1.5em;
            cursor: pointer;
        }

        /* Main Content Styles */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-bottom: 150px;
        }

        .main-content h1 {
            font-size: 2.5em;
            font-weight: 400;
            margin-bottom: 50px;
        }

        /* Input Bar Styles */
        .input-container {
            width: 100%;
            max-width: 700px;
            padding: 0 20px;
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
        }

        .input-bar {
            background-color: #343541;
            border: 1px solid #4d4f5b;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        .input-bar button {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.2em;
            margin: 0 5px;
            cursor: pointer;
            padding: 5px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        
        /* Highlight mic button when listening */
        .input-bar button.listening i {
            color: #6a49a8; /* Purple color */
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .input-bar button:hover {
            opacity: 1;
        }

        /* Main input field styling */
        #mainInput {
            flex-grow: 1;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1em;
            padding: 10px 10px;
            outline: none;
        }

        /* Platform Dropdown Styling */
        #platformSelect {
            background-color: #40414f;
            color: #ffffff;
            border: 1px solid #4d4f5b;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.9em;
            margin-right: 15px;
            appearance: none; 
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="dropdown-menu">
            <span>AutoMate.ai</span> 
        </div>
        <a href="#" class="upgrade-button">Upgrade to Go</a>
        <div class="settings-icon">
        </div>
    </header>

    <main class="main-content">
        <h1>Generate AI Posts for Social Media</h1>
    </main>

    <div class="input-container">
        <form id="postForm" class="input-bar" method="POST"> 
            <select name="platform" id="platformSelect">
                <option value="twitter">Twitter</option>
                <option value="linkedin">LinkedIn</option>
            </select>
            
            <button class="icon-plus" type="button">
                <i class="fas fa-plus"></i>
            </button>
            
            <input type="text" id="mainInput" name="topic" placeholder="Enter a topic for AI post or speak">
            
            <button class="icon-mic" type="button" id="micBtn">
                <i class="fas fa-microphone"></i>
            </button>
            
            <input type="hidden" name="action" id="actionInput" value="Generate Preview">
            
            <button class="icon-volume" type="submit" id="generateBtn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>
    </div>

    
    <script>
    const micBtn = document.getElementById("micBtn"); 
    const mainInput = document.getElementById("mainInput"); 
    const postForm = document.getElementById("postForm"); 
    const actionInput = document.getElementById("actionInput"); 

    // --- Speech Recognition Logic ---
    micBtn.addEventListener("click", () => {
        if (!('webkitSpeechRecognition' in window)) {
            alert("Speech recognition not supported in this browser.");
            return;
        }

        const recognition = new webkitSpeechRecognition();
        recognition.lang = "en-IN";
        recognition.continuous = false;
        recognition.interimResults = false;

        micBtn.classList.add("listening");
        recognition.start();

        recognition.onresult = (event) => {
            let speechText = event.results[0][0].transcript.toLowerCase().trim();

            if (speechText.includes("generate")) {
                const cleanedText = speechText.replace(/\bgenerate\b/g, "").trim();
                mainInput.value = cleanedText; 
                
                // Ensure the 'action' field is set correctly before submitting
                actionInput.value = 'Generate Preview'; 

                // TRADITIONAL SUBMISSION: Submit the form, causing a page reload.
                setTimeout(() => {
                    postForm.submit();
                }, 200);

            } else {
                mainInput.value = speechText;
            }
        };

        recognition.onerror = (event) => {
            console.error("Speech recognition error:", event.error);
            alert("Speech recognition error: " + event.error);
        };

        recognition.onend = () => {
            micBtn.classList.remove("listening");
        };
    });

    // --- TRADITIONAL Form Submission (NO AJAX, NO preventDefault) ---
    postForm.addEventListener("submit", (e) => {
        const topic = mainInput.value;
        
        if (topic.trim() === "") {
            alert("Please enter a topic before generating the post.");
            e.preventDefault(); // Only prevent if input is empty
            return;
        }
        
        // Ensure the hidden action field is set correctly for the Flask backend
        actionInput.value = 'Generate Preview';
    });
    </script>    

</body>
</html>
